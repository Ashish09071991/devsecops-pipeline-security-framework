# Azure DevOps Multi-Stage DevSecOps Pipeline
trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: SecurityScan
    displayName: 'Stage 1: Shift-Left Security Scans'
    jobs:
      - job: SecretAndIaCScan
        displayName: 'Secret Detection & IaC Security'
        steps:
          - script: |
              echo "Installing Checkov..."
              pip install checkov
              checkov -d . --framework terraform --soft-fail
            displayName: 'Run Checkov IaC Security Audit'

          - script: |
              echo "Installing Trivy..."
              sudo apt-get install wget apt-transport-https gnupg lsb-release -y
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
              echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
              sudo apt-get update && sudo apt-get install trivy -y
              trivy fs --severity HIGH,CRITICAL .
            displayName: 'Run Trivy Filesystem Scan'

  - stage: BuildAndValidate
    displayName: 'Stage 2: Terraform Validation'
    dependsOn: SecurityScan
    jobs:
      - job: ValidateTerraform
        displayName: 'Terraform Validate'
        steps:
          - script: |
              terraform fmt -check
              terraform init -backend=false
              terraform validate
            displayName: 'Execute Terraform Linting'
